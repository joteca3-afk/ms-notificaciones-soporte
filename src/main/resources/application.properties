

# Puerto asignado en la descomposición de microservicios
server.port=8082
spring.application.name=notification-service

# Conexión limpia a MySQL local (HTE)
spring.datasource.url=jdbc:mysql://localhost:3306/Notificaciones%20y%20Soporte?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=manuel123*

# Validación estricta impuesta por la guía docente
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilitación obligatoria de Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Rutas lógicas para el renderizado visual de Swagger en Spring Boot 4
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

